name: release

# Publishes @lolkda/dsh-rust-anything on a v* tag, with the three platform binaries built in.
#
# The first version (0.1.0) was published from a workstation because npm only lets you configure
# a Trusted Publisher for a package that already exists. From 0.2.0 on this workflow publishes
# with OIDC; it needs the trusted publisher configured on npmjs.com for this repository and the
# workflow file name `release.yml`, and it fails with a clear npm error until that is done.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use the latest npm (trusted publishing needs 11.5.1+)
        run: npm install -g npm@latest

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Vendor the binaries
        run: node scripts/vendor-binaries.mjs

      - name: Assemble and verify the package
        run: node scripts/build-npm.mjs

      - name: Smoke test the assembled package
        run: node test/smoke.mjs

      - name: Publish
        run: npm publish npm-out --access public
